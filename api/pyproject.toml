[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "padel-api"
version = "0.1.0"
description = "Padel Buddy API and job worker: uploads, calibration, analysis jobs and results"
readme = "README.md"
requires-python = ">=3.10"
# Also install the engine from this repo: pip install -e ../engine
dependencies = [
    "padel-engine",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
padel-api = "padel_api.main:serve"
padel-worker = "padel_api.worker:main"
padel-buddy = "padel_api.local:main"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
