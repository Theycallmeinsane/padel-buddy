[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "padel-engine"
version = "0.1.0"
description = "Padel Buddy video engine: court mapping, player tracking, clips and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Person detection. Install PyTorch for your platform first (CUDA, MPS or CPU):
# https://pytorch.org/get-started/locally/
detect = ["ultralytics>=8.3", "lap>=0.5"]
# Desktop click-to-calibrate tool.
calibrate = ["matplotlib>=3.8"]
# Written coaching summary in the match report (needs ANTHROPIC_API_KEY).
coach = ["anthropic>=1.15"]
dev = ["pytest>=8"]

[project.scripts]
padel-engine = "padel_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
